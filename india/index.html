<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Designed dark in its own colours: a phone's forced dark mode mustn't repaint it -->
  <meta name="color-scheme" content="dark only">
  <meta name="theme-color" content="#070606">
  <title>RSW · Coming Soon</title>
  <meta name="description" content="Real Saiyan Wellness. The awakening begins soon.">
  <meta property="og:title" content="RSW · Coming Soon">
  <meta property="og:description" content="Real Saiyan Wellness. The awakening begins soon.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <!-- Test link: keep search engines out. Remove when it goes on the real domain. -->
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Cormorant Garamond for the line, Manrope for the small print -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Manrope:wght@500;600&display=swap">
  <!-- India: Shrikhand for the Gujarati word and the stamp, Yatra One for the Hindi, Noto Serif for the
       small Gujarati and Hindi labels. Google serves each script's part only where it's used. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Yatra+One&family=Noto+Serif+Gujarati:wght@500;700&family=Noto+Serif+Devanagari:wght@500;700&display=swap">
  <!-- ?v= makes a phone fetch the new file after an update instead of a cached one: change it whenever these files change -->
  <link rel="stylesheet" href="../styles.css?v=12">
  <link rel="stylesheet" href="india.css?v=4">
  <!-- The soundtrack first: ink.js cues it -->
  <script src="music.js?v=5" defer></script>
  <script src="ink.js?v=8" defer></script>
</head>
<body>
  <h1 class="sr-only">RSW, Real Saiyan Wellness: the awakening begins soon. Coming soon.</h1>

  <main class="scene" aria-hidden="true">
    <div class="push">
      <div class="spot"></div>
      <div class="beat"></div>
      <canvas class="petals-back"></canvas>
      <canvas class="ink"></canvas>
      <div class="seal" lang="gu"><span>ટૂંક</span><span>સમયમાં</span></div>
      <!-- ink.js swaps these words for each shot -->
      <div class="copy">
        <p class="label"></p>
        <p class="line">The awakening begins soon.</p>
        <p class="soon">Coming soon</p>
      </div>
      <p class="presents">Real Saiyan Wellness <em>presents</em></p>
    </div>
    <canvas class="petals-front"></canvas>
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="bars"></div>
  </main>

  <header class="ui ui-top">
    <p class="brand">Real Saiyan Wellness</p>
    <button class="sound" type="button" aria-pressed="false">Sound <b>off</b></button>
  </header>
  <footer class="ui ui-bottom">
    <p class="place">Ahmedabad · <span lang="gu">અમદાવાદ</span></p>
    <button class="replay" type="button"><span aria-hidden="true">↻</span> Replay</button>
  </footer>

  <!-- Shown when the browser won't play sound before a tap: the tap starts the teaser and its music together -->
  <button class="gate" type="button" hidden>
    <span class="gate-mark">RSW</span>
    <span class="gate-cta"><span><span class="touch">Tap</span><span class="mouse">Click</span> to enter</span></span>
    <span class="gate-note"><span aria-hidden="true">♪</span> With sound</span>
  </button>

  <!-- Rough edges for the stamp, like ink pressed from a rubber stamp -->
  <svg width="0" height="0" aria-hidden="true" style="position: absolute">
    <filter id="stone"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter>
  </svg>
</body>
</html>
